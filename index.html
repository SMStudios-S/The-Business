<style>
:root{--bg:#120f0c;--bg2:#1c1814;--pn:#241f19;--pn2:#2e2720;--ln:#4a3f30;--tx:#efe4cc;--mu:#a89878;--gd:#ffd23a;--gr:#5ad06a;--rd:#e8584a;--bl:#4aa8e8;--pu:#b07ae8;
 --f:'J10',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:20px;overscroll-behavior:none}
body{background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:8px 8px}
button{font-family:var(--f);font-size:18px;color:var(--tx);cursor:pointer;touch-action:manipulation}
.px,canvas.pxc{image-rendering:pixelated;image-rendering:crisp-edges}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);border-left:2px solid #000;border-right:2px solid #000}
/* Kopf */
#top{padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 6px;background:var(--bg2);border-bottom:2px solid #000;display:flex;align-items:flex-start;gap:8px}
#top .m{flex:1;min-width:0}
#money{font-size:36px;font-weight:700;color:var(--gd);text-shadow:2px 2px 0 #000;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rate{font-size:17px;color:var(--gr)}#rate.neg{color:var(--rd)}
#meta{text-align:right;font-size:16px;color:var(--mu);line-height:1.5}
#meta b{color:var(--tx)}
.ph{display:inline-block;padding:1px 6px;border:2px solid #000;font-size:14px;margin-left:4px}.ph.boom{background:#2a5a2a;color:#a8f0a8}.ph.crash{background:#5a2020;color:#ffb0a0}.ph.stable{background:#3a3a44;color:#d0d0e0}
#gear{width:34px;height:34px;padding:0;background:var(--pn2);border:2px solid #000;box-shadow:inset -2px -2px 0 rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,255,255,.08);font-size:21px}
#sky{display:block;width:100%;height:96px;border-bottom:2px solid #000;image-rendering:pixelated;background:#3a7ad0}
#tick{height:24px;line-height:24px;background:#0c0a08;border-bottom:2px solid #000;font-size:16px;color:var(--mu);white-space:nowrap;overflow:hidden;padding:0 10px}
#tick span.good{color:var(--gr)}#tick span.bad{color:var(--rd)}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 18px}
/* Navigation */
#tabs{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg2);border-top:2px solid #000;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{background:none;border:0;border-right:2px solid #000;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--mu)}
#tabs button:last-child{border-right:0}
#tabs button img{width:26px;height:26px;opacity:.65}
#tabs button.on{background:var(--pn2);color:var(--gd)}#tabs button.on img{opacity:1}
#tabs button .dot{position:absolute;margin-left:18px;width:7px;height:7px;background:var(--rd);border:1px solid #000}
/* Panels */
h2{font-size:22px;margin:4px 2px 8px;color:var(--gd);text-shadow:2px 2px 0 #000;letter-spacing:.5px}
h3{font-size:18px;margin:14px 2px 6px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.pn{background:var(--pn);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.05),inset -2px -2px 0 rgba(0,0,0,.3);padding:10px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.row .gr{flex:1;min-width:0}
.card{display:flex;align-items:center;gap:10px;background:var(--pn);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.05),inset -2px -2px 0 rgba(0,0,0,.3);padding:8px;margin-bottom:6px}
.card.own{background:#262b1f}.card.lock{opacity:.5}.card.warn{background:#2f1d18}
.card .ic{width:44px;height:44px;flex:none}
.card .gr{flex:1;min-width:0}
.card .t{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:16px;color:var(--mu);margin-top:2px;line-height:1.35}
.s .g,.g{color:var(--gr)}.s .r,.r{color:var(--rd)}.y{color:var(--gd)}.b{color:var(--bl)}
.btn{background:#3a5a2a;border:2px solid #000;box-shadow:inset -2px -3px 0 rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,255,255,.15);padding:7px 10px;font-weight:600;white-space:nowrap;min-width:64px}
.btns .btn{white-space:normal;line-height:1.2;min-width:0;padding:7px 6px}
.btn:active{transform:translateY(1px);box-shadow:inset 2px 2px 0 rgba(0,0,0,.35)}
.btn.gold{background:#b8901a;color:#1a1208}.btn.red{background:#7a2a22}.btn.blue{background:#2a4a7a}.btn.gray{background:#3a3530}.btn.pu{background:#5a3a8a}
.btn[disabled],.btn.off{background:#2a2622;color:#6a5e4a;box-shadow:none}
.btn small{display:block;font-size:14px;font-weight:400;opacity:.85}
.bar{height:8px;background:#0c0a08;border:2px solid #000;position:relative;margin-top:4px}.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--gr)}
.bar.y>i{background:var(--gd)}.bar.r>i{background:var(--rd)}.bar.b>i{background:var(--bl)}
.tag{display:inline-block;font-size:13px;padding:0 5px;border:1px solid #000;margin-left:4px;vertical-align:middle}
.tag.g{background:#2a5a2a;color:#b0f0b0}.tag.r{background:#5a2020;color:#ffc0b0}.tag.y{background:#5a4a10;color:#ffe080}.tag.b{background:#20405a;color:#b0d8ff}
.stars{color:var(--gd);letter-spacing:-1px}
.sub{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}.sub button{flex:1;background:var(--pn);border:2px solid #000;padding:8px 6px;font-size:17px;color:var(--mu)}.sub button.on{background:var(--pn2);color:var(--gd);box-shadow:inset 0 -3px 0 var(--gd)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:17px}.kv span:nth-child(odd){color:var(--mu)}.kv span:nth-child(even){text-align:right}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btns .btn{flex:1}
.hint{background:#2a2410;border:2px solid #000;padding:9px 10px;font-size:17px;color:#f0e0a0;margin-bottom:8px;line-height:1.4}
.empty{color:var(--mu);font-size:17px;text-align:center;padding:16px}
/* Klick */
#clickZone{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;position:relative;user-select:none;-webkit-user-select:none}
#bigCoin{width:150px;height:150px;border:0;background:none;padding:0;transition:transform .05s}
#bigCoin img{width:100%;height:100%}
#bigCoin:active{transform:scale(.93)}
.fl{position:absolute;pointer-events:none;font-weight:700;color:var(--gd);text-shadow:2px 2px 0 #000;font-size:23px;animation:fl .9s steps(9) forwards}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.job{font-size:17px;color:var(--mu);margin-top:6px;text-align:center}.job b{color:var(--tx)}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--bg2);border:2px solid #000;border-bottom:0;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));animation:up .16s steps(4)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
#sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}#sheet .hd .t{font-size:23px;font-weight:700;color:var(--gd);text-shadow:2px 2px 0 #000;flex:1}
#sheet .x{width:36px;height:36px;background:var(--pn2);border:2px solid #000;font-size:23px}
/* Toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);flex-direction:column-reverse!important;z-index:60;display:flex;flex-direction:column;gap:5px;width:min(92vw,440px);pointer-events:none}
.toast{background:#1c1814;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:8px 10px;font-size:17px;animation:up .15s steps(3)}
.toast.good{border-left:6px solid var(--gr)}.toast.bad{border-left:6px solid var(--rd)}.toast.gold{border-left:6px solid var(--gd);color:var(--gd)}.toast.info{border-left:6px solid var(--bl)}
/* Börse */
.qrow{display:grid;grid-template-columns:40px 1fr 74px auto;gap:8px;align-items:center;background:var(--pn);border:2px solid #000;padding:6px 8px;margin-bottom:5px}
.qrow canvas{width:74px;height:28px;image-rendering:pixelated}
.qrow .sym{font-weight:700;font-size:17px}.qrow .nm{font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .pr{text-align:right;font-size:17px;white-space:nowrap}.qrow .pr small{display:block;font-size:14px}
.bigc{width:100%;height:150px;image-rendering:pixelated;background:#0c0a08;border:2px solid #000;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lux{background:var(--pn);border:2px solid #000;padding:8px;text-align:center}.lux img{width:54px;height:54px}.lux .t{font-size:17px;font-weight:600;margin-top:4px}.lux .s{font-size:16px;color:var(--mu)}.lux.own{background:#2a2a18}
.ach{display:flex;gap:8px;align-items:center;padding:6px 8px;background:var(--pn);border:2px solid #000;margin-bottom:4px;font-size:17px}.ach.no{opacity:.45}.ach .s{color:var(--mu);font-size:16px}
@media (min-width:900px){#app{max-width:760px}#sky{height:120px}.grid2.lx{grid-template-columns:1fr 1fr 1fr}}

/* ===== The Business: Spiel-HUD ===== */
html,body{font-size:19px;overflow:hidden;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#0c0a08}
#cv{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 0;display:flex;align-items:flex-start;gap:8px;background:none;border:0;pointer-events:none}
#top>*{pointer-events:auto}
.mbox{background:rgba(18,15,12,.82);border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.4);padding:4px 10px 3px;min-width:0}
#money{font-size:24px;font-weight:700;color:var(--gd);text-shadow:2px 2px 0 #000;white-space:nowrap}

.mtick{position:absolute;left:0;right:0;bottom:0;height:26px;background:rgba(0,0,0,.75);border-top:2px solid #000;overflow:hidden;white-space:nowrap;font-size:16px;line-height:24px}
.mtick div{display:inline-block;animation:tk 40s linear infinite}.mtick span{margin:0 18px;color:#c8b898}.mtick b{color:#efe4cc}.mtick i{font-style:normal}
@keyframes tk{to{transform:translateX(-50%)}}
.mwrap{position:relative;z-index:2;margin-bottom:24px}
@media (max-height:430px){.lg2{font-size:54px}.mpanel{padding:8px;gap:6px}.btn.big{padding:6px 12px;font-size:19px}.mwrap{gap:6px}}

@media (orientation:landscape) and (min-width:640px){
 #menu .mwrap:has(.logo){display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto auto;column-gap:28px;align-items:center;width:min(94vw,900px);margin-bottom:60px}
 #menu .mwrap:has(.logo) .logo{grid-column:1;grid-row:1}
 #menu .mwrap:has(.logo) .msub{grid-column:1;grid-row:2;text-align:center}
 #menu .mwrap:has(.logo) .mpanel{grid-column:2;grid-row:1/4}
 #menu .mwrap:has(.logo) .mcred{grid-column:1;grid-row:3;text-align:center}
 #menu .lg2{font-size:clamp(56px,9vw,104px)}
}
#menu .logo{position:relative;text-align:center;filter:drop-shadow(0 0 18px rgba(255,190,40,.35))}
#menu .logo::after{content:"";position:absolute;inset:-6px -20px;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:250% 100%;animation:shine 4.5s linear infinite;mix-blend-mode:overlay;pointer-events:none}

// Weg-Suche im Grundstück (BFS über das Gebäude)
function lotPath(l,sx,sy,tx,ty){const ox=l.x-1,oy=l.y-1,W=l.w+2,H=l.h+2;const N=W*H;const prev=new Int32Array(N).fill(-1);const q=[];

 const si=(sy-oy)*W+(sx-ox);if(si<0||si>=N)return null;prev[si]=si;q.push(si);let h=0;const ti=(ty-oy)*W+(tx-ox);
 while(h<q.length){const c=q[h++];if(c===ti)break;const cx=c%W+ox,cy=(c/W|0)+oy;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;const ni=(ny-oy)*W+(nx-ox);if(nx<ox||ny<oy||nx>=ox+W||ny>=oy+H||prev[ni]>=0)continue;if(!ok(nx,ny))continue;prev[ni]=c;q.push(ni)}}
 if(ti<0||ti>=N||prev[ti]<0)return null;const p=[];let c=ti;while(c!==si){p.push([c%W+ox,(c/W|0)+oy]);c=prev[c]}p.reverse();return p}

let toastFn=null,newsFn=null;

function spend(x,nocb){if(S.money<x-1e-6){toast(tt('Nicht genug Geld!','Not enough money!'),'bad');sfx('err');return false}S.money-=x;if(!nocb&&x>=10&&S.bank){const cb=x*cardOf().cb;if(cb>0){S.money+=cb;S.st.cb=(S.st.cb||0)+cb}}gainXP(x*.02);return true}
const own=l=>S.lots[l.id];
const ownedLots=()=>LOTS.filter(l=>S.lots[l.id]);
const bizLots=()=>LOTS.filter(l=>S.lots[l.id]&&S.lots[l.id].bt&&!S.lots[l.id].lease);
function npcOf(l){if(S.lots[l.id]||(S.vac&&S.vac[l.id]))return null;return l.npc||null}
function lotName(l){const o=S.lots[l.id];if(l.kind==='spec')return T(SPEC[l.spec].n);if(l.kind==='apt')return tt('Wohnhaus ','Apartments ')+LN[l.npcN];if(o&&o.build)return tt('Baustelle','Construction site');if(l.kind==='empty')return l.priv?tt('Privatinsel','Private island'):tt('Bauplatz','Building plot');
 if(o&&o.lease)return T(btOf(o.lease).n)+' '+LN[l.npcN||0];if(o&&o.bt)return o.name||T(btOf(o.bt).n);if(o)return l.kind==='res'?resName(l):tt('Dein Laden','Your shop');

// ---------- Immobilienpreise ----------
const lotArea=l=>l.area||Math.max(20,(l.pw-2)*7);
function landVal(l){const d=distOf(l.dist);return l.pw*l.ph*d.rt*300*S.dIdx[l.dist]*S.gIdx*(l.priv?4:1)}
function bldVal(l){if(l.kind==='res')return l.hv?l.hv.cost*S.gIdx:0;if(l.kind==='empty')return 0;const d=distOf(l.dist);return lotArea(l)*900*(.6+d.rt*.4)*S.gIdx*(l.kind==='apt'?3:1)}
function lotPrice(l){return Math.round((landVal(l)+bldVal(l))/10)*10}

function fillListings(init){S.listings=S.listings.filter(x=>x.left>0&&!S.lots[x.id]);if(!S.vac)S.vac={};

const B=()=>S.bank;
const cardOf=()=>CARDS.find(c=>c.id===B().card)||CARDS[0];
const acctSum=()=>B().accts.reduce((a,x)=>a+x.bal,0);
const loanSum=()=>B().loans.reduce((a,x)=>a+x.left,0);
function bondVal(){let v=0;for(const h of B().bonds)v+=h.units*100;return v}
const bankAssets=()=>acctSum()+bondVal()-loanSum();
function acctRate(a){const r=ACCT[a.t].rate+cardOf().rb*(a.t==='save'?1:.5);return r}
function openAcct(t){const b=B();if(t==='save'&&b.accts.filter(a=>a.t==='save').length>=3){toast(tt('Maximal 3 Tagesgeldkonten.','Max. 3 savings accounts.'),'bad');return}
 const a={id:++b.aid,t,bal:0};if(ACCT[t].days)a.until=0;b.accts.push(a);sfx('buy');toast(tt('Konto eröffnet: ','Account opened: ')+T(ACCT[t].n),'good');return a}
function acctDep(id,x){const a=B().accts.find(q=>q.id===id);if(!a)return;x=Math.min(x,S.money);if(x<=0)return;if(a.t.startsWith('fix')&&a.bal>0&&a.until>S.day){toast(tt('Festgeld läuft noch – erst nach Ablauf aufstocken.','Fixed deposit still running.'),'bad');return}
 S.money-=x;a.bal+=x;if(ACCT[a.t].days)a.until=S.day+ACCT[a.t].days;sfx('cash')}
function acctWd(id,x){const a=B().accts.find(q=>q.id===id);if(!a)return;if(a.t.startsWith('fix')&&a.until>S.day){toast(tt('Festgeld ist bis Tag ','Fixed until day ')+a.until+tt(' gesperrt.',' (locked).'),'bad');sfx('err');return}x=Math.min(x,a.bal);if(x<=0)return;a.bal-=x;S.money+=x;sfx('cash')}
function closeAcct(id){const b=B();const a=b.accts.find(q=>q.id===id);if(!a||a.bal>0||b.accts.length<=1)return;b.accts=b.accts.filter(q=>q!==a)}
// Bonität (300–850) & Kredite
function income7(){let v=0;for(const l of ownedLots())v+=Math.max(0,lotProfit(l));return v}
function loanRate(days){const s=B().score;let r=.0035-(s-300)/550*.0022;r+=days>=90?.0004:days>=30?.0002:0;return Math.max(.0006,r-cardOf().rb*.3)}
function credLimit(){const s=B().score;const base=assets()*.6+income7()*40+(bizLots().length?2000:500);return Math.max(0,Math.round(base*(.4+(s-300)/550)*({classic:1,gold:1.3,plat:1.8,black:2.5,diamond:4}[B().card]||1)))}
function takeLoan(amt,days,silent){const b=B();amt=Math.round(amt);const room=credLimit()-loanSum();if(amt>room){if(!silent){toast(tt('Die Bank lehnt ab – Kreditrahmen: ','Declined – credit room: ')+fm(Math.max(0,room)),'bad');sfx('err')}return false}
 const r=loanRate(days);const total=amt*(1+r*days);b.loans.push({id:++b.lid,amt,left:total,rate:r,days,pay:total/days,start:S.day,miss:0});S.money+=amt;sfx('cash');if(!silent)toast(tt('Kredit ausgezahlt: ','Loan paid out: ')+fm(amt),'good');return true}
function repayLoan(id,x){const b=B();const l=b.loans.find(q=>q.id===id);if(!l)return;x=Math.min(x==null?l.left:x,S.money,l.left);if(x<=0)return;S.money-=x;l.left-=x;if(l.left<.5){b.loans=b.loans.filter(q=>q!==l);b.score=Math.min(850,b.score+12);toast(tt('Kredit abbezahlt! Bonität steigt.','Loan repaid! Credit score up.'),'good')}sfx('cash')}

// Täglich
function bankDay(){const b=B();let rep=[];
 for(const a of b.accts){const r=acctRate(a);if(a.t.startsWith('fix')){if(a.until>=S.day)a.bal*=1+r}else a.bal*=1+r}
 const fee=cardOf().fee;if(fee){S.money-=fee}
 for(const l of b.loans){const p=Math.min(l.pay,l.left);if(S.money>=p){S.money-=p;l.left-=p}else{let need=p-Math.max(0,S.money);for(const a of b.accts){if(a.t!=='save'&&a.t!=='biz')continue;const t=Math.min(a.bal,need);a.bal-=t;need-=t}if(need<=1){S.money=Math.max(0,S.money);l.left-=p}else{l.miss++;l.left+=p*.05;b.score=Math.max(300,b.score-25);rep.push(l)}}}
 const before=b.loans.length;b.loans=b.loans.filter(l=>l.left>.5);if(b.loans.length<before)b.score=Math.min(850,b.score+10);
 if(!rep.length&&b.loans.length)b.score=Math.min(850,b.score+1);
 if(rep.length)news('⚠️ '+tt('Kreditrate nicht bezahlt! Bonität sinkt.','Loan payment missed! Credit score drops.'),'bad');
 for(let i=b.bonds.length-1;i>=0;i--){const h=b.bonds[i];const bd=BONDS.find(x=>x.id===h.b);if(R()<bd.risk/bd.days){news('💥 '+T(bd.n)+tt(': Zahlungsausfall!',': default!'),'bad');S.money+=h.units*100*rf(0,.3);b.bonds.splice(i,1);continue}
  S.money+=h.units*100*bd.cp;S.st.coupons=(S.st.coupons||0)+h.units*100*bd.cp;if(S.day>=h.until){S.money+=h.units*100;b.bonds.splice(i,1);news('📜 '+T(bd.n)+tt(' fällig – ausgezahlt.',' matured – paid out.'),'good')}}}
function bankIncomeDay(){const b=B();let v=0;for(const a of b.accts)v+=a.bal*acctRate(a);for(const h of b.bonds)v+=h.units*100*BONDS.find(x=>x.id===h.b).cp;for(const l of b.loans)v-=l.left*l.rate;return v-cardOf().fee}

 if(darkness()>.3){sc+=3;why.push(tt('Nacht','night'))}const o=OUTFITS.find(x=>x.id===S.outfit);if(o)sc+=o.pr*.4;if(S.pet){const p=PETS.find(x=>x.id===S.pet);sc+=p.pr*.8;why.push(T(p.n))}
